<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Layout</title>
        <link rel=icon href="hqdefault.jpg">
        <link rel="stylesheet" href="17b.css">
    </head>
    <body>
        <main>
            <section class="video-grid">
                <!--video 1-->
                <div class="video-preview">
                    <div class="thumbnail-row">
                        <img class="thumbnail" src="oliver.avif">
                        <div class="video-time">
                            10:13
                        </div>
                    </div>
                    <div class="video-info-grid">
                        <div class="channel-picture">
                            <img class="profile-picture" src="hqdefault.jpg">
                        </div>
                        <div class="vido-info">
                            <p class="video-title">
                                Sample Video Title
                            </p>
                            <p class="video-author">
                                Chaneel Name
                            </p>
                            <p class="video-stats">
                                1M views . 1 year ago
                            </p>
                        </div>
                    </div>
                </div>
<!--video 2-->
<div class="video-preview">
    <div class="thumbnail-row">
        <img class="thumbnail" src="rex.avif">
        <div class="video-time">7:12</div>
    </div>
    <div class="video-info-grid">
        <div class="chaneel-picture">
            <img class="profile-picture" src="mini.avif">
        </div>
        <div class="video-info">
            <p class="video-info">Another Video</p>
            <p class="video-author">Tech channel</p>
            <p class="video-stats">500k views . 6 months ago</p>
        </div>
    </div>
</div>
    </section>
        </main>
    </body>
</html>
